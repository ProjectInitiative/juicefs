# Distributed-cache-group ring test on the DGX Spark nodes — VSO-native.
#
# Creds flow (no superuser password involved):
#   OpenBao kv-v2 k8s/gcache-test/sparks:
#     username:      gcache_sparks        (PG role name)
#     password:      <user-generated, URL-safe> (PG role password)
#     s3-access-key / s3-secret-key       (Garage)
#   VaultStaticSecret #1 (postgres-db ns) -> Secret/gcache-pg-role
#     type kubernetes.io/basic-auth (username+password only) — consumed by
#     CNPG's DatabaseRole to provision the managed role.
#   VaultStaticSecret #2 (gcache-test ns) -> Secret/gcache-creds (full entry)
#     — consumed by members + init/format job.
#   DatabaseRole + Database objects (postgres-db ns) let the CNPG operator
#   create the role and database declaratively. cluster refs are
#   LocalObjectReference => these objects MUST live in postgres-db.
#
# RDMA pod conventions follow glm53-parity: runtimeClassName nvidia-rdma,
# hostNetwork, privileged, rdma/hca_shared_devices: 1, fabric-json rails.
#
# Apply:   kubectl apply -f deploy/gcache-test/spark-ring.yaml
# Watch:   kubectl -n gcache-test get pods -w
# Result:  kubectl -n gcache-test logs -f job/gcache-verify-reader
# Cleanup: kubectl delete ns gcache-test
#          kubectl -n postgres-db delete databaserole gcache-sparks database gcache-sparks
#          kubectl -n postgres-db delete vaultauth pgcache-auth vaultstaticsecret gcache-pg-role-vss sa operator-auth-sa
---
apiVersion: v1
kind: Namespace
metadata:
  name: gcache-test
  labels:
    vault-auth: enabled
---
# postgres-db already exists; apply merges this label in (needed for the
# reviewer RBAC machinery, same as every other vault-auth namespace).
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-db
  labels:
    vault-auth: enabled
---
# The cluster's OpenBao kubernetes role binds the SA NAME (not namespace):
# every vault-auth namespace uses this exact SA name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-auth-sa
  namespace: gcache-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-auth-sa
  namespace: postgres-db
---
# ============ VaultAuth per namespace ============
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: gcache-auth
  namespace: gcache-test
spec:
  method: kubernetes
  mount: kubernetes_cluster_mc
  vaultConnectionRef: default
  kubernetes:
    audiences:
      - vault
    role: openbao-secrets-operator
    serviceAccount: operator-auth-sa
  namespace: production
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: pgcache-auth
  namespace: postgres-db
spec:
  method: kubernetes
  mount: kubernetes_cluster_mc
  vaultConnectionRef: default
  kubernetes:
    audiences:
      - vault
    role: openbao-secrets-operator
    serviceAccount: operator-auth-sa
  namespace: production
---
# ============ VaultStaticSecrets ============
# Full entry into the test namespace (s3 creds + role creds for meta URI).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gcache-creds-vss
  namespace: gcache-test
spec:
  vaultAuthRef: gcache-auth
  mount: k8s
  type: kv-v2
  path: gcache-test/sparks
  refreshInterval: 1h
  destination:
    name: gcache-creds
    create: true
    overwrite: true
---
# Basic-auth slice into postgres-db for the CNPG managed role.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gcache-pg-role-vss
  namespace: postgres-db
spec:
  vaultAuthRef: pgcache-auth
  mount: k8s
  type: kv-v2
  path: gcache-test/sparks
  refreshInterval: 1h
  destination:
    name: gcache-pg-role
    type: kubernetes.io/basic-auth
    create: true
    overwrite: true
    transformation:
      includes:
        - username
        - password
---
# ============ CNPG declarative role + database ============
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: gcache-sparks
  namespace: postgres-db
spec:
  cluster: {name: postgres-cluster}
  name: gcache_sparks
  ensure: present
  login: true
  connectionLimit: -1
  passwordSecret:
    name: gcache-pg-role
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: gcache-sparks
  namespace: postgres-db
spec:
  cluster: {name: postgres-cluster}
  name: gcache_sparks
  owner: gcache_sparks
  ensure: present
---
# ============ Format volume (no DB creation needed anymore) ============
apiVersion: batch/v1
kind: Job
metadata:
  name: gcache-init
  namespace: gcache-test
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: 172.16.1.50:31872/gcache-juicefs:arm64
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PGUSER=$(cat /etc/gcache/username)
              PGPASSWORD=$(cat /etc/gcache/password)
              META="postgres://${PGUSER}:${PGPASSWORD}@postgres-cluster-rw.postgres-db.svc:5432/gcache_sparks"
              # wait until the CNPG operator has provisioned role + database
              until psql "$META" -c "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for gcache_sparks database/role..."; sleep 3
              done
              echo "database reachable"
              juicefs format "$META" gcachesparks \
                --storage s3 \
                --bucket "http://ingress.haproxy.svc.cluster.local:80/juicefs-mc/gcache-sparks" \
                --access-key "$(cat /etc/gcache/s3-access-key)" \
                --secret-key "$(cat /etc/gcache/s3-secret-key)" \
                --compress none \
                --block-size 4096 \
                --force
              echo "GCACHE-INIT-DONE"
          volumeMounts:
            - {name: creds, mountPath: /etc/gcache}
      volumes:
        - name: creds
          secret: {secretName: gcache-creds}
---
# ============ Member entry (rail-IP peer listener) ============
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcache-member-entry
  namespace: gcache-test
data:
  entry.sh: |
    #!/bin/bash
    set -euo pipefail
    NODE_NAME=${NODE_NAME:?}
    PGUSER=$(cat /etc/gcache/username)
    PGPASSWORD=$(cat /etc/gcache/password)
    META="postgres://${PGUSER}:${PGPASSWORD}@postgres-cluster-rw.postgres-db.svc:5432/gcache_sparks"
    # Resolve this node's first C7 rail IP from the fabric inventory
    RAIL_IP=$(python3 - "/var/lib/dgx-spark/rdma-fabric.json" <<'PY'
    import json, sys, ipaddress
    f = json.load(open(sys.argv[1]))
    rail = f["links"][0]["address"]
    print(ipaddress.ip_interface(rail).ip)
    PY
    )
    echo "[gcache-member] node=$NODE_NAME rail-ip=$RAIL_IP"
    CACHE_DIR=/var/lib/gcache/${NODE_NAME}
    mkdir -p "$CACHE_DIR"
    exec juicefs mount "$META" /jfs \
      --cache-group=sparks \
      --cache-dir="$CACHE_DIR" \
      --cache-size 102400 \
      --group-listen "${RAIL_IP}:3910" \
      --no-bgjob \
      --metrics 0.0.0.0:9900 \
      --log-level debug \
      --foreground
---
# ============ Members (1:1 node pinning) ============
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-chronometer
  namespace: gcache-test
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: member-chronometer}}
  template:
    metadata: {labels: {app: member-chronometer}}
    spec:
      runtimeClassName: nvidia-rdma
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {kubernetes.io/hostname: chronometer}
      securityContext: {seccompProfile: {type: Unconfined}}
      containers:
        - name: juicefs
          image: 172.16.1.50:31872/gcache-juicefs:arm64
          securityContext: {privileged: true}
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
          resources:
            requests: {cpu: "4", memory: 2Gi, rdma/hca_shared_devices: "1"}
            limits: {cpu: "8", memory: 8Gi, rdma/hca_shared_devices: "1"}
          command: ["bash", "/entry/entry.sh"]
          ports:
            - {name: peer, containerPort: 3910, hostPort: 3910}
            - {name: metrics, containerPort: 9900, hostPort: 9900}
          volumeMounts:
            - {name: creds, mountPath: /etc/gcache}
            - {name: entry, mountPath: /entry}
            - {name: fabric, mountPath: /var/lib/dgx-spark}
            - {name: fuse, mountPath: /dev/fuse}
          readinessProbe:
            exec: {command: ["bash", "-c", "test -f /jfs/.stats"]}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: creds
          secret: {secretName: gcache-creds}
        - name: entry
          configMap: {name: gcache-member-entry}
        - name: fabric
          hostPath: {path: /var/lib/dgx-spark, type: Directory}
        - name: fuse
          hostPath: {path: /dev/fuse, type: CharDevice}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-sextant
  namespace: gcache-test
spec:
