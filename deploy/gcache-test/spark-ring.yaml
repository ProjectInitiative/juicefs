---
# ============ Verify: writer (chronometer) ============
apiVersion: batch/v1
kind: Job
metadata:
  name: gcache-verify-writer
  namespace: gcache-test
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      runtimeClassName: nvidia-rdma
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {kubernetes.io/hostname: chronometer}
      restartPolicy: Never
      containers:
        - name: verify
          image: 172.16.1.50:31872/gcache-juicefs:arm64
          securityContext: {privileged: true}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PGUSER=$(cat /etc/gcache/username)
              PGPASSWORD=$(cat /etc/gcache/password)
              META="postgres://${PGUSER}:${PGPASSWORD}@postgres-cluster-rw.postgres-db.svc:5432/gcache_sparks"
              sleep 25   # members join + settle
              juicefs mount "$META" /jfs \
                --cache-group=sparks --cache-size 0 --no-bgjob \
                --metrics 127.0.0.1:9902 --log-level debug --foreground &
              MPID=$!
              for i in $(seq 1 30); do test -f /jfs/.stats && break; sleep 1; done
              test -f /jfs/.stats || { echo "FAIL: writer mount never came up"; exit 1; }
              head -c 33554432 /dev/urandom > /jfs/sparktest.bin
              md5sum /jfs/sparktest.bin | cut -d' ' -f1 > /jfs/sparktest.md5
              echo done > /jfs/.writer-done
              for i in $(seq 1 120); do [ -f /jfs/.reader-done ] && break; sleep 2; done
              kill $MPID 2>/dev/null || true
              cat /jfs/.verify-result 2>/dev/null || echo "no reader result"
              curl -s http://127.0.0.1:9902/metrics | grep -E "^juicefs_remotecache" || true
          volumeMounts:
            - {name: creds, mountPath: /etc/gcache}
            - {name: fuse, mountPath: /dev/fuse}
      volumes:
        - name: creds
          secret: {secretName: gcache-creds}
        - name: fuse
          hostPath: {path: /dev/fuse, type: CharDevice}
---
# ============ Verify: reader (sextant) ============
apiVersion: batch/v1
kind: Job
metadata:
  name: gcache-verify-reader
  namespace: gcache-test
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      runtimeClassName: nvidia-rdma
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {kubernetes.io/hostname: sextant}
      restartPolicy: Never
      containers:
        - name: verify
          image: 172.16.1.50:31872/gcache-juicefs:arm64
          securityContext: {privileged: true}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PGUSER=$(cat /etc/gcache/username)
              PGPASSWORD=$(cat /etc/gcache/password)
              META="postgres://${PGUSER}:${PGPASSWORD}@postgres-cluster-rw.postgres-db.svc:5432/gcache_sparks"
              juicefs mount "$META" /jfs \
                --cache-group=sparks --cache-size 0 --no-bgjob \
                --metrics 127.0.0.1:9902 --log-level debug --foreground &
              MPID=$!
              for i in $(seq 1 30); do test -f /jfs/.stats && break; sleep 1; done
              test -f /jfs/.stats || { echo "FAIL: reader mount never came up"; exit 1; }
              for i in $(seq 1 60); do [ -f /jfs/.writer-done ] && break; sleep 2; done
              test -f /jfs/.writer-done || { echo "FAIL: writer never finished"; exit 1; }
              sleep 2
              B=$(md5sum /jfs/sparktest.bin | cut -d' ' -f1)
              A=$(cat /jfs/sparktest.md5)
              echo "checksums: writer=$A reader=$B"
              sleep 2  # async counters
              GETS=$(curl -s http://127.0.0.1:9902/metrics | grep "^juicefs_remotecache_gets" | awk '{s+=$2} END {print s+0}')
              BYTES=$(curl -s http://127.0.0.1:9902/metrics | grep "^juicefs_remotecache_bytes" | awk '{s+=$2} END {print s+0}')
              ERRS=$(curl -s http://127.0.0.1:9902/metrics | grep "^juicefs_remotecache_errors" | awk '{s+=$2} END {print s+0}')
              echo "reader peer fetches=$GETS bytes=$BYTES errors=$ERRS"
              if [ "$A" = "$B" ] && [ "${GETS:-0}" -gt 0 ]; then
                echo "PASS: Spark ring peer fetch verified over C7 fabric ($GETS fetches, $BYTES bytes)"
                echo "PASS" > /jfs/.verify-result
              else
                echo "FAIL: checksum mismatch or zero peer fetches"
                echo "FAIL" > /jfs/.verify-result
                exit 1
              fi
              echo done > /jfs/.reader-done
          volumeMounts:
            - {name: creds, mountPath: /etc/gcache}
            - {name: fuse, mountPath: /dev/fuse}
      volumes:
        - name: creds
          secret: {secretName: gcache-creds}
        - name: fuse
          hostPath: {path: /dev/fuse, type: CharDevice}
