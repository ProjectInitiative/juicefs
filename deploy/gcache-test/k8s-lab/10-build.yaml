apiVersion: batch/v1
kind: Job
metadata:
  name: lb-build-chronometer
  namespace: llm-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      nodeName: chronometer
      restartPolicy: Never
      containers:
      - name: build
        image: golang:1.25-bookworm
        command: ["bash","-c"]
        args:
        - |
          set -euxo pipefail
          mkdir -p /out
          cd /tmp
          curl -fsSL https://codeload.github.com/ProjectInitiative/juicefs/tar.gz/refs/heads/low-latency-ranged-reads -o src.tgz
          tar xzf src.tgz
          cd juicefs-low-latency-ranged-reads
          CGO_ENABLED=0 go build -trimpath -o /out/latencybench ./tools/latencybench
          apt-get update -qq && apt-get install -y -qq librdmacm-dev >/dev/null
          CGO_ENABLED=1 go build -tags rdma -trimpath -o /out/latencybench-rdma ./tools/latencybench
          echo BUILD_OK arm64 + rdma
        volumeMounts: [{ name: out, mountPath: /out }]
      volumes:
      - name: out
        hostPath: { path: /var/tmp/lb-bins, type: DirectoryOrCreate }
