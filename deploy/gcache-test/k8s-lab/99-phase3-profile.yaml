# Phase 3 — matched TCP-vs-verbs latency profiling.
# Server (sextant, rail 172.16.5.56): FOUR listeners on identical datasets —
#   verbs mem :13930 | verbs NVMe O_DIRECT :13931 | TCP mem :13932 | TCP NVMe :13933
# Run matched sequential legs on the same 4096-key × 4 MiB dataset; every read
# verifies its payload. Primary inference profile: batch=70 (independent 4 KiB
# reads per round; qd is irrelevant in batch mode), three reps per transport.
# Supplementary 8-second QD sweeps at 1/8/32/64 on warm NVMe and RAM.
# Expected registered footprint = (512 recv + 8 send) × 64 KiB = 32.5 MiB/conn.
# NCCL-concurrent testing is deliberately not included; it needs live inference.
apiVersion: batch/v1
kind: Job
metadata:
  name: lb-p3-srv
  namespace: llm-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      nodeName: sextant
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: srv
        image: golang:1.25-bookworm
        securityContext: { privileged: true }
        command: ["bash","-c"]
        args:
        - |
          apt-get update -qq && apt-get install -y -qq librdmacm-dev libibverbs-dev >/dev/null
          /var/tmp/lb-bins/latencybench-rdma serve --rdma --rdma-proto verbs --nics enp1s0f1np1 --addr :13930 --src mem --blocks 4096 --blocksize 4194304 2>&1 &
          /var/tmp/lb-bins/latencybench-rdma serve --rdma --rdma-proto verbs --nics enp1s0f1np1 --addr :13931 --src file --file /var/tmp/lb-data/bench.bin --blocksize 4194304 --direct 2>&1 &
          /var/tmp/lb-bins/latencybench-rdma serve --addr 172.16.5.56:13932 --src mem --blocks 4096 --blocksize 4194304 2>&1 &
          /var/tmp/lb-bins/latencybench-rdma serve --addr 172.16.5.56:13933 --src file --file /var/tmp/lb-data/bench.bin --blocksize 4194304 --direct 2>&1 &
          echo "phase3 servers up; waiting forever"
          sleep infinity
        volumeMounts:
        - { name: bins, mountPath: /var/tmp/lb-bins, readOnly: true }
        - { name: data, mountPath: /var/tmp/lb-data, readOnly: true }
        - { name: dev, mountPath: /dev }
      volumes:
      - name: bins
        hostPath: { path: /var/tmp/lb-bins, type: Directory }
      - name: data
        hostPath: { path: /var/tmp/lb-data, type: Directory }
      - name: dev
        hostPath: { path: /dev, type: Directory }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lb-p3-cli
  namespace: llm-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      nodeName: chronometer
      restartPolicy: Never
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: cli
        image: golang:1.25-bookworm
        securityContext: { privileged: true }
        command: ["bash","-c"]
        args:
        - |
          apt-get update -qq && apt-get install -y -qq librdmacm-dev libibverbs-dev >/dev/null
          # Server process bind failures appear in its logs; client readiness below
          # is a bounded connection attempt, not a blind long wait.
          LBR=/var/tmp/lb-bins/latencybench-rdma
          RAIL=172.16.5.56
          OUT=/var/tmp/lb-out; mkdir -p $OUT
          echo "waiting briefly for server startup"
          sleep 10
          COMMON="--keys 4096 --range --verify --len 4096"
          echo "##### warm-up: one verbs + one TCP leg to settle caches (discarded)"
          timeout 120 $LBR read --backend peer --addr $RAIL:13931 --rdma --rdma-proto verbs $COMMON --qd 1 --secs 5 > /dev/null 2>&1 || true
          timeout 120 $LBR read --backend peer --addr $RAIL:13933 $COMMON --qd 1 --secs 5 > /dev/null 2>&1 || true
          echo "##### PRIMARY: batch-70 warm remote NVMe, 3 reps each transport"
          for rep in 1 2 3; do
            # Preserve complete output in the Job log as well as JSON files.
            timeout 200 $LBR read --backend peer --addr $RAIL:13931 --rdma --rdma-proto verbs $COMMON --batch 70 --secs 15 --out $OUT/primary-verbs-r$rep.json 2>&1 | grep -E '===|read|batch|iops|verify' || echo "PRIMARY verbs r$rep FAILED"
            timeout 200 $LBR read --backend peer --addr $RAIL:13933 $COMMON --batch 70 --secs 15 --out $OUT/primary-tcp-r$rep.json 2>&1 | grep -E '===|read|batch|iops|verify' || echo "PRIMARY tcp r$rep FAILED"
          done
          echo "##### NVMe QD sweep: verbs vs TCP (cold first, then warm)"
          for qd in 1 8 32 64; do
            timeout 200 $LBR read --backend peer --addr $RAIL:13931 --rdma --rdma-proto verbs $COMMON --qd $qd --secs 8 --out $OUT/nvme-verbs-qd$qd.json 2>&1 | grep -E '===|iops|verify' || echo "nvme verbs qd$qd FAILED"
            timeout 200 $LBR read --backend peer --addr $RAIL:13933 $COMMON --qd $qd --secs 8 --out $OUT/nvme-tcp-qd$qd.json 2>&1 | grep -E '===|iops|verify' || echo "nvme tcp qd$qd FAILED"
          done
          echo "##### mem QD sweep: verbs vs TCP (all warm)"
          for qd in 1 8 32 64; do
            timeout 200 $LBR read --backend peer --addr $RAIL:13930 --rdma --rdma-proto verbs $COMMON --qd $qd --secs 8 --out $OUT/mem-verbs-qd$qd.json 2>&1 | grep -E '===|iops|verify' || echo "mem verbs qd$qd FAILED"
            timeout 200 $LBR read --backend peer --addr $RAIL:13932 $COMMON --qd $qd --secs 8 --out $OUT/mem-tcp-qd$qd.json 2>&1 | grep -E '===|iops|verify' || echo "mem tcp qd$qd FAILED"
          done
          echo "##### phase3 client done"
        volumeMounts:
        - { name: bins, mountPath: /var/tmp/lb-bins, readOnly: true }
        - { name: out, mountPath: /var/tmp/lb-out }
      volumes:
      - name: bins
        hostPath: { path: /var/tmp/lb-bins, type: Directory }
      - name: out
        hostPath: { path: /var/tmp/lb-out, type: DirectoryOrCreate }
