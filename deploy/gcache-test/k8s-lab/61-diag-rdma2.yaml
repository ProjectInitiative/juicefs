# deep RDMA diagnostic: verbs level (ibv_devinfo) vs rsockets level (C probe)
apiVersion: batch/v1
kind: Job
metadata:
  name: lb-diag-rdma2
  namespace: llm-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      nodeName: sextant
      restartPolicy: Never
      containers:
      - name: diag
        image: golang:1.25-bookworm
        command: ["bash","-c"]
        args:
        - |
          set -x
          apt-get update -qq && apt-get install -y -qq librdmacm-dev ibverbs-utils strace >/dev/null
          ibv_devinfo 2>&1 | head -30
          echo "=== netdev<->ib mapping ==="
          ls /sys/class/net/
          for n in /sys/class/net/*; do echo -n "$n device: "; readlink $n/device 2>/dev/null || echo "-"; done
          echo "=== minimal rsocket() probe ==="
          cat > /tmp/t.c <<'EOF'
          #include <rdma/rsocket.h>
          #include <errno.h>
          #include <stdio.h>
          #include <string.h>
          int main() {
            int fd = rsocket();
            printf("rsocket()=%d errno=%d (%s)\n", fd, errno, fd < 0 ? strerror(errno) : "ok");
            return 0;
          }
          EOF
          gcc /tmp/t.c -o /tmp/t -lrdmacm
          /tmp/t
          echo "=== strace tail of the probe ==="
          strace -f -e trace=openat,ioctl /tmp/t 2>&1 | tail -15
        securityContext: { privileged: true }
        volumeMounts:
        - { name: dev, mountPath: /dev }
        - { name: sys, mountPath: /host-sys, readOnly: true }
      volumes:
      - name: dev
        hostPath: { path: /dev, type: Directory }
      - name: sys
        hostPath: { path: /sys, type: Directory }
