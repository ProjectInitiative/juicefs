# gcache latencybench — stage 0: probe the DGX Sparks (storage, RDMA devices,
# librdmacm) before placing datasets and RDMA pods. Jobs (not bare Pods) —
# agent-sandbox enforces PodSecurity restricted on Pods; job templates pass.
# Read-only hostPath mounts only. Self-cleans via ttlSecondsAfterFinished.
apiVersion: batch/v1
kind: Job
metadata:
  name: lb-probe-chronometer
  namespace: llm-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeName: chronometer
      restartPolicy: Never
      containers:
      - name: probe
        image: busybox:1.36
        command: ["sh","-c"]
        args:
        - |
          echo "== infiniband devices"; ls /sys/class/infiniband/ 2>&1
          echo "== rdma cm"; ls /sys/class/misc/rdma_cm 2>&1
          echo "== librdmacm (system profile)"; ls /host-sw/lib 2>/dev/null | grep -i rdma
          echo "== root fs"; df -h / /var/tmp 2>&1 | head -5
          echo "/var/tmp write:"; touch /var/tmp/lb-probe && echo WRITABLE && rm -f /var/tmp/lb-probe
          echo "== mounts"; grep -vE "proc|sysfs|cgroup|devpts|tmpfs /sys|securityfs" /proc/mounts | head -12
          echo "== mem"; head -2 /proc/meminfo
        volumeMounts:
        - { name: sw, mountPath: /host-sw, readOnly: true }
      volumes:
      - name: sw
        hostPath: { path: /run/current-system/sw, type: Directory }
