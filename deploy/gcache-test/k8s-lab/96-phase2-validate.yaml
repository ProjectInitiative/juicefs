# Phase-2 hardware validation: hardened-POC wave test + real peer protocol over verbs.
# Server (sextant, rail-0 172.16.5.56): latencybench-rdma serve --rdma --rdma-proto verbs
#   on :13930 (mem 4096 blocks) and :13931 (NVMe O_DIRECT file), plus vb_echo :14090.
# Client (chronometer): wave test via vb_echo; protocol matrix via latencybench read.
apiVersion: batch/v1
kind: Job
metadata:
  name: lb-p2-srv
  namespace: llm-test
  annotations: { lb-role: "long-running; delete the job to stop it" }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 21600
  template:
    spec:
      nodeName: sextant
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: srv
        image: golang:1.25-bookworm
        securityContext: { privileged: true }
        command: ["bash","-c"]
        args:
        - |
          apt-get update -qq && apt-get install -y -qq librdmacm-dev libibverbs-dev >/dev/null
          export VB_SRV_IP=172.16.5.56
          # verbs POC echo server (wave/lifecycle test target)
          stdbuf -o0 /var/tmp/lb-bins/vb_echo server 14090 2>&1 &
          # real peer protocol: memory-backed (4096 blocks x 4 MiB)
          /var/tmp/lb-bins/latencybench-rdma serve --rdma --rdma-proto verbs --nics enp1s0f1np1 --addr :13930 --src mem --blocks 4096 --blocksize 4194304 2>&1 &
          # real peer protocol: NVMe O_DIRECT-backed (4096 blocks x 4 MiB = 16 GiB file)
          /var/tmp/lb-bins/latencybench-rdma serve --rdma --rdma-proto verbs --nics enp1s0f1np1 --addr :13931 --src file --file /var/tmp/lb-data/bench.bin --blocksize 4194304 --direct 2>&1 &
          sleep 8
          echo "phase2 servers up; waiting forever"
          sleep infinity
        volumeMounts:
        - { name: bins, mountPath: /var/tmp/lb-bins, readOnly: true }
        - { name: data, mountPath: /var/tmp/lb-data, readOnly: true }
        - { name: dev, mountPath: /dev }
      volumes:
      - name: bins
        hostPath: { path: /var/tmp/lb-bins, type: Directory }
      - name: data
        hostPath: { path: /var/tmp/lb-data, type: Directory }
      - name: dev
        hostPath: { path: /dev, type: Directory }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lb-p2-cli
  namespace: llm-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      nodeName: chronometer
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: cli
        image: golang:1.25-bookworm
        securityContext: { privileged: true }
        command: ["bash","-c"]
        args:
        - |
          apt-get update -qq && apt-get install -y -qq librdmacm-dev libibverbs-dev >/dev/null
          RAIL=172.16.5.56
          export VB_SRC_IP=172.16.5.55
          export VB_DEBUG=1
          LBR=/var/tmp/lb-bins/latencybench-rdma
          OUT=/var/tmp/lb-out-p2; mkdir -p $OUT
          echo "waiting for servers..."; sleep 45

          echo "##### 0. hardened-POC wave test (same server process):"
          echo "#####    3 waves x 8/16/32/64/128 + 10 rapid + 256KiB frag"
          for c in 8 16 32 64 128; do
            echo "##### WAVES conns=$c"
            timeout 300 /var/tmp/lb-bins/vb_echo client $RAIL 14090 $c 5 4096 3 3000
            echo "exit $?"
          done
          timeout 600 /var/tmp/lb-bins/vb_echo client $RAIL 14090 8 2 4096 10 3000; echo "rapid exit $?"
          timeout 300 /var/tmp/lb-bins/vb_echo client $RAIL 14090 8 3 262144 2 3000; echo "frag exit $?"

          echo "##### 0b. local loopback Go-transport smoke (serve+read same pod):"
          (VB_DEBUG=1  serve --rdma --rdma-proto verbs --nics enp1s0f1np1 --addr :13940 --src mem --blocks 64 --blocksize 4194304 > /tmp/loop-serve.log 2>&1 &) ; sleep 3
          VB_DEBUG=1 timeout 60  read --backend peer --addr 172.16.5.55:13940 --rdma --rdma-proto verbs --keys 4096 --range --verify --len 4096 --qd 1 --secs 5 || echo "LOOPBACK FAILED"
          echo "--- loopback serve log head ---"; head -30 /tmp/loop-serve.log
          echo "##### 1. 4KiB mem-backed QD1/QD8/QD32/QD64 (verbs strict):"
          timeout 200 $LBR read --backend peer --addr $RAIL:13930 --rdma --rdma-proto verbs --keys 4096 --range --verify --len 4096 --qd 1,8,32,64 --secs 8 --out $OUT/p2-mem-verbs.json || echo "F1 FAILED"
          echo "##### 2. 4KiB NVMe O_DIRECT-backed QD1/QD8/QD32/QD64:"
          timeout 200 $LBR read --backend peer --addr $RAIL:13931 --rdma --rdma-proto verbs --keys 4096 --range --verify --len 4096 --qd 1,8,32,64 --secs 8 --out $OUT/p2-nvme-verbs.json || echo "F2 FAILED"
          echo "##### 3. batch-70 mem-backed (verbs):"
          timeout 200 $LBR read --backend peer --addr $RAIL:13930 --rdma --rdma-proto verbs --keys 4096 --range --verify --len 4096 --batch 70 --secs 15 --out $OUT/p2-batch70-mem-verbs.json || echo "F3 FAILED"
          echo "##### 4. batch-70 NVMe O_DIRECT (verbs):"
          timeout 200 $LBR read --backend peer --addr $RAIL:13931 --rdma --rdma-proto verbs --keys 4096 --range --verify --len 4096 --batch 70 --secs 15 --out $OUT/p2-batch70-nvme-verbs.json || echo "F4 FAILED"
          echo "##### 5. TCP reference (same server host, TCP mem):"
          echo "     (skipped here — TCP numbers from RESULTS-dgx-rail.md; server has no TCP listener)"
          echo "##### phase2 client done"
        volumeMounts:
        - { name: bins, mountPath: /var/tmp/lb-bins, readOnly: true }
        - { name: data, mountPath: /var/tmp/lb-data, readOnly: true }
        - { name: dev, mountPath: /dev }
      volumes:
      - name: bins
        hostPath: { path: /var/tmp/lb-bins, type: Directory }
      - name: data
        hostPath: { path: /var/tmp/lb-data, type: Directory }
      - name: dev
        hostPath: { path: /dev, type: Directory }
