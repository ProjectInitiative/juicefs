# Focused F2 probe: NVMe O_DIRECT qd=64 with full correlation logging (VB_DEBUG).
# Server on sextant; client on chronometer; short run so logs stay greppable.
apiVersion: batch/v1
kind: Job
metadata:
  name: lb-f2-srv
  namespace: llm-test
  annotations: { lb-role: "long-running; delete the job to stop it" }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 21600
  template:
    spec:
      nodeName: sextant
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: srv
        image: golang:1.25-bookworm
        securityContext: { privileged: true }
        command: ["bash","-c"]
        args:
        - |
          export VB_DEBUG=1
          /var/tmp/lb-bins/latencybench-rdma serve --rdma --rdma-proto verbs --nics enp1s0f1np1 --addr :13931 --src file --file /var/tmp/lb-data/bench.bin --blocksize 4194304 --direct 2>&1
        volumeMounts:
        - { name: bins, mountPath: /var/tmp/lb-bins, readOnly: true }
        - { name: data, mountPath: /var/tmp/lb-data, readOnly: true }
        - { name: dev, mountPath: /dev }
      volumes:
      - name: bins
        hostPath: { path: /var/tmp/lb-bins, type: Directory }
      - name: data
        hostPath: { path: /var/tmp/lb-data, type: Directory }
      - name: dev
        hostPath: { path: /dev, type: Directory }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lb-f2-cli
  namespace: llm-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      nodeName: chronometer
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: cli
        image: golang:1.25-bookworm
        securityContext: { privileged: true }
        command: ["bash","-c"]
        args:
        - |
          apt-get update -qq && apt-get install -y -qq librdmacm-dev libibverbs-dev >/dev/null
          export VB_DEBUG=1
          LBR=/var/tmp/lb-bins/latencybench-rdma
          echo "waiting for server..."; sleep 20
          echo "##### F2 probe: 4KiB NVMe O_DIRECT qd=64 (verbs strict):"
          timeout 120 $LBR read --backend peer --addr 172.16.5.56:13931 --rdma --rdma-proto verbs --keys 4096 --range --verify --len 4096 --qd 64 --secs 12 || echo "F2 FAILED"
          echo "##### f2 probe done"
        volumeMounts:
        - { name: bins, mountPath: /var/tmp/lb-bins, readOnly: true }
        - { name: dev, mountPath: /dev }
      volumes:
      - name: bins
        hostPath: { path: /var/tmp/lb-bins, type: Directory }
      - name: dev
        hostPath: { path: /dev, type: Directory }
