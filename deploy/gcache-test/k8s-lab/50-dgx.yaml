apiVersion: batch/v1
kind: Job
metadata:
  name: lb-dgx-client
  namespace: llm-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      nodeName: chronometer
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: matrix
        image: golang:1.25-bookworm
        command: ["bash","-c"]
        args:
        - |
          set -e
          LB=/var/tmp/lb-bins/latencybench
          LBR=/var/tmp/lb-bins/latencybench-rdma
          OUT=/var/tmp/lb-data/results
          mkdir -p $OUT
          RAIL=172.16.5.56   # sextant rail-0 (chronometer-sextant-0)

          echo "##### A) mem source: pure transport (no NVMe in the way)"
          echo "--- A1 tcp"
          timeout 120 $LB  read --backend peer --addr $RAIL:13921 --keys 256 --range --verify --len 4096 --qd 1,8,64 --secs 8 --out $OUT/dgx-mem-tcp.json
          echo "--- A2 rsockets strict"
          apt-get update -qq && apt-get install -y -qq librdmacm-dev >/dev/null
          $LBR read --backend peer --addr $RAIL:13922 --rdma --keys 256 --range --verify --len 4096 --qd 1,8 --secs 8 --out $OUT/dgx-mem-rdma.json

          echo "##### B) file source (O_DIRECT NVMe): the owner-NVMe model"
          echo "--- B1 tcp"
          timeout 120 $LB  read --backend peer --addr $RAIL:13911 --keys 4096 --range --verify --len 4096 --qd 1,8,64 --secs 8 --out $OUT/dgx-file-tcp.json
          echo "--- B2 rsockets strict"
          $LBR read --backend peer --addr $RAIL:13912 --rdma --keys 4096 --range --verify --len 4096 --qd 1,8 --secs 8 --out $OUT/dgx-file-rdma.json

          echo "##### C) batch-70 — THE inference metric (batch completion p99)"
          echo "--- C1 file tcp"
          timeout 120 $LB  read --backend peer --addr $RAIL:13911 --keys 4096 --range --verify --len 4096 --batch 70 --secs 15 --out $OUT/dgx-batch70-file-tcp.json
          echo "--- C2 file rsockets"
          $LBR read --backend peer --addr $RAIL:13912 --rdma --keys 4096 --range --verify --len 4096 --batch 70 --secs 15 --out $OUT/dgx-batch70-file-rdma.json
          echo "--- C3 mem tcp"
          timeout 120 $LB  read --backend peer --addr $RAIL:13921 --keys 256 --range --verify --len 4096 --batch 70 --secs 15 --out $OUT/dgx-batch70-mem-tcp.json
          echo "--- C4 mem rsockets"
          $LBR read --backend peer --addr $RAIL:13922 --rdma --keys 256 --range --verify --len 4096 --batch 70 --secs 15 --out $OUT/dgx-batch70-mem-rdma.json
          echo "DGX_MATRIX_DONE"
        securityContext: { privileged: true }
        volumeMounts:
        - { name: bins, mountPath: /var/tmp/lb-bins, readOnly: true }
        - { name: data, mountPath: /var/tmp/lb-data }
        - { name: dev, mountPath: /dev }
      volumes:
      - name: bins
        hostPath: { path: /var/tmp/lb-bins, type: Directory }
      - name: data
        hostPath: { path: /var/tmp/lb-data, type: DirectoryOrCreate }
      - name: dev
        hostPath: { path: /dev, type: Directory }
