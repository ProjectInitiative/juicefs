# 25GiB ring performance bench + failover drill.
#
# SAFETY (RISK-0018 / DEC-0024, keel):
#   The first run (unbounded, on octant) grew host page cache until the
#   node OOM'd and evicted the TensorFold worker. Rules now:
#     - bench only on the model-free spark (TP2 pair: head=octant,
#       worker=sextant => bench=chronometer), priority 0 (preemptible).
#     - HARD memory limits: cgroup v2 charges page cache to the pod, so a
#       6Gi cap protects the host AND keeps reads honest (delivery path is
#       NVMe/fabric, not RAM). drop_caches between every phase.
#     - O_DIRECT reads when FUSE permits (probe + fallback).
#
# bench-perf phases (single pod on chronometer, itself a ring member):
#   A  ring mount (8GiB local cache, fill ON) writes 25GiB; every 4MiB
#      block is uploaded to Garage AND pushed to its HRW owner across the
#      3 spark members. 90s settle, then the bench cache is wiped.
#   B  drop caches -> cold read via a FRESH ring mount: ~75% of blocks
#      served by peers over the C7 rails (remotecache delta proves it).
#   B2 drop caches -> read again: peers hold every block in their NVMe
#      caches (LoadCached on serve) => full-fabric read.
#   C  drop caches -> read via a plain --cache-size 0 mount: pure Garage.
#   D  repeat C for variance.
# All reads md5-checked against the write-time digest.
#
# bench-failover (apply alongside; it self-coordinates):
#   waits until ALL of sextant's rail addrs refuse (operator deletes the
#   member pod — deployment recreates it automatically), reads the file
#   during the outage: checksum must hold (fallback paths), then waits
#   for sextant to rejoin and re-reads with a fresh mount.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-perf
  namespace: gcache-test
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 14400
  template:
    spec:
      runtimeClassName: nvidia-rdma
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # RISK-0018 / DEC-0024: TP2 pair is head=octant + worker=sextant;
      # the bench runs on the model-free spark, priority 0 (preemptible).
      nodeSelector: {kubernetes.io/hostname: chronometer}
      restartPolicy: Never
      containers:
        - name: bench
          image: 172.16.1.50:31872/gcache-juicefs:arm64
          securityContext: {privileged: true}
          resources:
            # HARD limits (RISK-0018): the unbounded run OOM'd a node via
            # page-cache growth. The 6Gi cap protects the host AND keeps
            # the benchmark honest (reads must come from NVMe/fabric).
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 6Gi}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PGUSER=$(cat /etc/gcache/username); PGPASSWORD=$(cat /etc/gcache/password)
              META="postgres://${PGUSER}:${PGPASSWORD}@postgres-cluster-rw.postgres-db.svc:5432/gcache_sparks"
              NODE_IP=$(hostname -I | awk '{print $1}')
              drop_cache() { sync; echo 3 > /proc/sys/drop_caches; }
              elapsed() { awk "BEGIN{printf \"%.1f\", ($2-$1)/1e9}"; }
              peerbytes() { curl -s localhost:9904/metrics | grep '^juicefs_remotecache_bytes' | awk '{s+=$2} END {print s+0}'; }

              echo "=== PHASE-A: prime (ring write 25GiB, fill ON)"
              juicefs mount "$META" /jfs \
                --cache-group=sparks --cache-dir=/tmp/bcache --cache-size 8192 \
                --group-listen "${NODE_IP}:3914" --fill-group-cache --no-bgjob \
                --metrics 127.0.0.1:9904 --log-level info --foreground &
              MPID=$!
              for i in $(seq 1 40); do test -f /jfs/.stats && break; sleep 1; done
              test -f /jfs/.stats || { echo "FAIL: ring mount"; exit 1; }
              # Paced write (run-2 lesson): 64 batches of 400MiB + 2s gaps
              # keep Garage PUT latency sane while the shared storage also
              # serves the LLM PVC (volume now points at garage svc direct).
              T0=$(date +%s%N)
              for b in $(seq 1 64); do
                dd if=/dev/urandom of=/jfs/bench25g.bin bs=4M count=100 oflag=append status=none
                sleep 2
              done
              T1=$(date +%s%N)
              echo "PHASE-A: write $(elapsed $T0 $T1)s"
              MD5=$( { md5sum /jfs/bench25g.bin 2>/dev/null || { sleep 5; md5sum /jfs/bench25g.bin; } ; } | cut -d' ' -f1)
              echo "PHASE-A: md5=$MD5"
              echo "$MD5" > /jfs/bench25g.md5
              echo "PHASE-A: settling owner pushes (90s)..."
              sleep 90
              umount /jfs 2>/dev/null || fusermount3 -u /jfs || true
              kill $MPID 2>/dev/null || true; wait $MPID 2>/dev/null || true
              rm -rf /tmp/bcache
              drop_cache

              echo "=== PHASE-B: cold ring read (fresh mount, cache wiped)"
              juicefs mount "$META" /jfs \
                --cache-group=sparks --cache-dir=/tmp/bcache --cache-size 1024 \
                --group-listen "${NODE_IP}:3914" --no-bgjob \
                --metrics 127.0.0.1:9904 --log-level info --foreground &
              MPID=$!
              for i in $(seq 1 40); do test -f /jfs/.stats && break; sleep 1; done
              test -f /jfs/.stats || { echo "FAIL: ring mount"; exit 1; }
              # Prefer O_DIRECT (NVMe-over-fabric, not page cache); fall back
              # to buffered reads (bounded by the 6Gi pod cap + drop_cache).
              if dd if=/jfs/bench25g.bin of=/dev/null bs=4M count=1 iflag=direct status=none 2>/dev/null; then
                RDIF="iflag=direct"; echo "BENCH: O_DIRECT reads enabled"
              else
                RDIF=""; echo "BENCH: O_DIRECT unavailable; buffered reads (6Gi pod cap)"
              fi
              # One read with a single transparent retry (transient EOFs were
              # observed through the shared ingress; direct svc should not
              # need it, but the checksum verdict must not hinge on one flake).
              timed_read() {
                local T0 T1 rc
                T0=$(date +%s%N); dd if=$1 of=/dev/null bs=4M $RDIF status=none; rc=$?; T1=$(date +%s%N)
                if [ $rc -ne 0 ]; then
                  echo "  (read rc=$rc; drop_cache + retry)"
                  drop_cache
                  T0=$(date +%s%N); dd if=$1 of=/dev/null bs=4M $RDIF status=none; rc=$?; T1=$(date +%s%N)
                fi
                ELAPSED=$(elapsed $T0 $T1)
                return $rc
              }
              G0=$(peerbytes)
              timed_read /jfs/bench25g.bin || { echo "PHASE-B: read failed twice"; exit 1; }
              echo "PHASE-B: cold ring read $ELAPSED$s"
              sleep 3
              G1=$(peerbytes)
              echo "PHASE-B: peer bytes served=$((G1-G0)) ($(( (G1-G0)/1048576 ))MiB)"
              MD=$(md5sum /jfs/bench25g.bin | cut -d' ' -f1)
              [ "$MD" = "$MD5" ] && echo "PHASE-B: md5 OK" || { echo "PHASE-B: MD5 MISMATCH"; exit 1; }

              echo "=== PHASE-B2: warm-peer ring read (peers cached on serve)"
              drop_cache
              G0=$G1
              timed_read /jfs/bench25g.bin || { echo "PHASE-B2: read failed twice"; exit 1; }
              echo "PHASE-B2: warm-peer read $ELAPSED$s"
              sleep 3
              G1=$(peerbytes)
              echo "PHASE-B2: peer bytes served=$((G1-G0)) ($(( (G1-G0)/1048576 ))MiB)"
              MD=$(md5sum /jfs/bench25g.bin | cut -d' ' -f1)
              [ "$MD" = "$MD5" ] && echo "PHASE-B2: md5 OK" || { echo "PHASE-B2: MD5 MISMATCH"; exit 1; }

              umount /jfs 2>/dev/null || fusermount3 -u /jfs || true
              kill $MPID 2>/dev/null || true; wait $MPID 2>/dev/null || true

              echo "=== PHASE-C: Garage baseline (no ring)"
              juicefs mount "$META" /jfs-base --cache-size 0 --no-bgjob \
                --metrics 127.0.0.1:9905 --log-level info --foreground &
              BPID=$!
              for i in $(seq 1 40); do test -f /jfs-base/.stats && break; sleep 1; done
              test -f /jfs-base/.stats || { echo "FAIL: base mount"; exit 1; }
              drop_cache
              timed_read /jfs-base/bench25g.bin || { echo "PHASE-C: read failed twice"; exit 1; }
              echo "PHASE-C: garage baseline $ELAPSED$s"
              drop_cache
              timed_read /jfs-base/bench25g.bin || { echo "PHASE-D: read failed twice"; exit 1; }
              echo "PHASE-D: garage baseline 2 $ELAPSED$s"
              MD=$(md5sum /jfs-base/bench25g.bin | cut -d' ' -f1)
              [ "$MD" = "$MD5" ] && echo "PHASE-D: md5 OK" || { echo "PHASE-D: MD5 MISMATCH"; exit 1; }
              echo "BENCH-PERF-DONE"
              kill $BPID 2>/dev/null || true
          volumeMounts:
            - {name: creds, mountPath: /etc/gcache}
            - {name: fuse, mountPath: /dev/fuse}
      volumes:
        - name: creds
          secret: {secretName: gcache-creds}
        - name: fuse
          hostPath: {path: /dev/fuse, type: CharDevice}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-failover
  namespace: gcache-test
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 14400
  template:
    spec:
      runtimeClassName: nvidia-rdma
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # RISK-0018 / DEC-0024: bounded, model-free spark, priority 0.
      nodeSelector: {kubernetes.io/hostname: chronometer}
      restartPolicy: Never
      containers:
        - name: bench
          image: 172.16.1.50:31872/gcache-juicefs:arm64
          securityContext: {privileged: true}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 6Gi}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PGUSER=$(cat /etc/gcache/username); PGPASSWORD=$(cat /etc/gcache/password)
              META="postgres://${PGUSER}:${PGPASSWORD}@postgres-cluster-rw.postgres-db.svc:5432/gcache_sparks"
              NODE_IP=$(hostname -I | awk '{print $1}')
              drop_cache() { sync; echo 3 > /proc/sys/drop_caches; }
              elapsed() { awk "BEGIN{printf \"%.1f\", ($2-$1)/1e9}"; }
              stats() { curl -s localhost:9904/metrics | grep "^juicefs_remotecache_$1" | awk '{s+=$2} END {print s+0}'; }
              SEX_ADDRS="172.16.5.56 172.16.6.56 172.16.9.56 172.16.10.56"

              echo "=== FO-WAIT: waiting for sextant member to go down"
              DOWN=0
              for i in $(seq 1 900); do
                OK=0
                for ip in $SEX_ADDRS; do
                  timeout 1 bash -c "echo > /dev/tcp/$ip/3910" 2>/dev/null && OK=1
                done
                [ $OK -eq 0 ] && { DOWN=1; break; }
                sleep 3
              done
              [ $DOWN -eq 1 ] || { echo "FAIL: sextant never went down"; exit 1; }
              echo "FO: sextant confirmed down; mounting ring and reading"
              sleep 5

              juicefs mount "$META" /jfs \
                --cache-group=sparks --cache-dir=/tmp/fcache --cache-size 1024 \
                --group-listen "${NODE_IP}:3914" --no-bgjob \
                --metrics 127.0.0.1:9904 --log-level info --foreground &
              MPID=$!
              for i in $(seq 1 40); do test -f /jfs/.stats && break; sleep 1; done
              test -f /jfs/.stats || { echo "FAIL: ring mount during outage"; exit 1; }
              if dd if=/jfs/bench25g.bin of=/dev/null bs=4M count=1 iflag=direct status=none 2>/dev/null; then
                RDIF="iflag=direct"
              else
                RDIF=""
              fi
              E0=$(stats errors)
              T0=$(date +%s%N); dd if=/jfs/bench25g.bin of=/dev/null bs=4M $RDIF status=none; T1=$(date +%s%N)
              echo "FO-OUTAGE: read with sextant down $(elapsed $T0 $T1)s"
              MD=$(md5sum /jfs/bench25g.bin | cut -d' ' -f1)
              EXPECTED=$(cat /jfs/bench25g.md5)
              [ "$MD" = "$EXPECTED" ] && echo "FO-OUTAGE: md5 OK - data intact with a member down" || { echo "FO-OUTAGE: MD5 MISMATCH"; exit 1; }
              sleep 3
              E1=$(stats errors)
              echo "FO-OUTAGE: remotecache errors delta=$((E1-E0)) (fallbacks; expect >0)"
              umount /jfs 2>/dev/null || fusermount3 -u /jfs || true
              kill $MPID 2>/dev/null || true; wait $MPID 2>/dev/null || true

              echo "=== FO-WAIT: waiting for sextant to rejoin"
              UP=0
              for i in $(seq 1 900); do
                for ip in $SEX_ADDRS; do
                  timeout 1 bash -c "echo > /dev/tcp/$ip/3910" 2>/dev/null && UP=1 && break
                done
                [ $UP -eq 1 ] && break
                sleep 3
              done
              [ $UP -eq 1 ] || { echo "FAIL: sextant never came back"; exit 1; }
              echo "FO: sextant rejoined; fresh mount, read again"
              sleep 10
              juicefs mount "$META" /jfs \
                --cache-group=sparks --cache-dir=/tmp/fcache --cache-size 1024 \
                --group-listen "${NODE_IP}:3914" --no-bgjob \
                --metrics 127.0.0.1:9904 --log-level info --foreground &
              MPID=$!
              for i in $(seq 1 40); do test -f /jfs/.stats && break; sleep 1; done
              G0=$(stats bytes); E0=$(stats errors)
              T0=$(date +%s%N); dd if=/jfs/bench25g.bin of=/dev/null bs=4M $RDIF status=none; T1=$(date +%s%N)
              echo "FO-REJOIN: read $(elapsed $T0 $T1)s"
              sleep 3
              G1=$(stats bytes); E1=$(stats errors)
              echo "FO-REJOIN: peer bytes=$((G1-G0)) ($(( (G1-G0)/1048576 ))MiB) errors=$((E1-E0))"
              echo "BENCH-FAILOVER-DONE"
              kill $MPID 2>/dev/null || true
          volumeMounts:
            - {name: creds, mountPath: /etc/gcache}
            - {name: fuse, mountPath: /dev/fuse}
      volumes:
        - name: creds
          secret: {secretName: gcache-creds}
        - name: fuse
          hostPath: {path: /dev/fuse, type: CharDevice}
